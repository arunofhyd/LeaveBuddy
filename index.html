<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Buddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon/abouticon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icon/abouticon.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <img src="assets/icon/abouticon.png" alt="Leave Buddy Logo" class="header-logo">
            <h2>Leave Buddy</h2>
        </header>

        <nav class="app-tabs">
            <button class="nav-button active" data-action="change-view" data-view="calendar">
                <i class="fas fa-calendar-days"></i> Calendar
            </button>
            <button class="nav-button" data-action="change-view" data-view="stats">
                <i class="fas fa-chart-pie"></i> Stats
            </button>
            <button class="nav-button" data-action="change-view" data-view="settings">
                <i class="fas fa-cog"></i> Settings
            </button>
        </nav>

        <main id="main-content" class="main-content">
            </main>

        <footer class="app-footer">
            <a href="mailto:arunthomas040402001@gmail.com">
                <i class="fas fa-envelope"></i>
                Reach out to the developer
            </a>
        </footer>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div id="modal-content" class="modal-content">
            </div>
    </div>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
