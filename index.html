<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="WRsy4WRJ0atAtw_tRfGLcnzrKRt_7liBfQRSDw2eo0Y" />
    <title>Leave Buddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo.png">
    <link rel="icon" type="image/png" sizes="48x48" href="assets/logo.png">
    <link rel="shortcut icon" href="assets/logo.png">

    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        /* ===== CSS CUSTOM PROPERTIES ===== */
        :root {
            /* Dark theme variables (default) */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-glass: rgba(30, 41, 59, 0.8);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --main-color: #6366f1;
            --main-color-dark: #4338ca;
            --main-color-light: #a5b4fc;
            --accent-color: #14b8a6;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --shadow-primary: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            --shadow-secondary: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            --shadow-soft: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.3);
            --gradient-primary: linear-gradient(135deg, var(--main-color) 0%, var(--main-color-dark) 100%);
        
            /* New login page-specific variables for dark theme */
            --login-text-primary: #f8fafc;
            --login-text-secondary: #94a3b8;
            --login-card-bg: rgba(255, 255, 255, 0.1);
            --login-card-border: rgba(255, 255, 255, 0.2);
            --login-divider-color: rgba(255, 255, 255, 0.3);
            --login-input-text: #f8fafc;
            --login-input-bg: rgba(255, 255, 255, 0.1); /* Darker variant for dark theme */
            --login-input-border: rgba(255, 255, 255, 0.2);
        }
        
        /* Light theme variables */
        body.light-theme {
            --bg-primary: #f0f4f8; /* A very light, subtle blue-gray */
            --bg-secondary: #ffffff;
            --bg-tertiary: #e2e8f0; /* A slightly darker subtle blue-gray */
            --bg-glass: rgba(255, 255, 255, 0.9);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --shadow-primary: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --shadow-secondary: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
            --shadow-soft: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.12);
        
            /* New login page-specific variables for light theme */
            --login-text-primary: #1e293b;
            --login-text-secondary: #64748b;
            --login-card-bg: rgba(255, 255, 255, 0.9);
            --login-card-border: #e2e8f0;
            --login-divider-color: #e2e8f0;
            --login-input-text: #1e293b;
            --login-input-bg: #f8fafc;
            --login-input-border: #e2e8f0;
        }
        
        /* ===== BASE STYLES ===== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 16px;
        }
        /* Dark theme specific background */
        body:not(.light-theme) {
            background: linear-gradient(135deg, #0d121c 0%, #171d2b 100%);
        }
        
        /* Login page-specific styles */
        #login-container {
            background: var(--bg-primary);
        }
        body:not(.light-theme) #login-container {
            background: linear-gradient(135deg, #0d121c 0%, #171d2b 100%);
        }
        
        .login-text-primary {
            color: var(--login-text-primary);
        }
        .login-text-secondary {
            color: var(--login-text-secondary);
        }
        .login-card-bg {
            background: var(--login-card-bg);
            border-color: var(--login-card-border);
        }
        .login-divider {
            border-color: var(--login-divider-color);
        }
        .login-input-text {
            color: var(--login-input-text);
        }
        .bg-login-input-bg {
            background-color: var(--login-input-bg);
        }
        .border-login-input-border {
            border-color: var(--login-input-border);
        }

        /* Dark mode specific input styling */
        body:not(.light-theme) .login-input-text {
            color: var(--login-text-primary);
        }
        body:not(.light-theme) .bg-login-input-bg {
            background-color: var(--bg-secondary);
        }
        body:not(.light-theme) .border-login-input-border {
            border-color: var(--border-color);
        }
        
        /* ===== FADE TRANSITION UTILITIES ===== */
        .is-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity 0.2s ease;
        }
        
        .is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        
        /* ===== BUTTON STYLES ===== */
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        body.light-theme .btn-secondary {
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }
        body.light-theme .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        /* ===== IMPROVED LAYOUT ===== */
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 20px 32px 20px;
            position: relative;
        }
        
        @media (min-width: 768px) {
            .app-container {
                max-width: 768px;
                padding: 0 24px 40px 24px;
            }
        }
        
        @media (min-width: 1024px) {
            .app-container {
                max-width: 1024px;
                padding: 0 3rem 4rem 3rem;
            }
        }
        
        @media (min-width: 1280px) {
            .app-container {
                max-width: 1280px;
                padding: 0 4rem 5rem 4rem;
            }
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 0 16px 24px 16px;
            }
        }
        
        /* ===== MODERN HEADER ===== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 20px;
            margin: 0 -20px 24px -20px;
        }
        
        .app-header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 480px;
            margin: 0 auto;
        }
        
        @media (min-width: 768px) {
            .app-header-content {
                max-width: 768px;
            }
        }
        
        @media (min-width: 1024px) {
            .app-header-content {
                max-width: 1024px;
            }
        }
        
        @media (min-width: 1280px) {
            .app-header-content {
                max-width: 1280px;
            }
        }
        
        .app-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .app-header-title img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            box-shadow: var(--shadow-soft);
            object-fit: cover;
        }
        
        @media (min-width: 768px) {
            .app-header-title h1 {
                font-size: 28px;
            }
        }
        
        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            box-shadow: var(--shadow-soft);
            margin-right: auto;
            flex-shrink: 0;
        }
        .app-header-content > .flex.items-center.gap-2:first-child {
            justify-content: flex-start;
        }
        .app-header-content > .flex.items-center.gap-2:last-child {
            justify-content: flex-end;
        }
        
        .theme-toggle-btn:hover,
        .theme-toggle-btn:active {
            background: var(--main-color);
            color: white;
            transform: scale(1.05);
            box-shadow: var(--shadow-secondary);
        }
        
        .header-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
        }
        
        .header-icon-btn:hover {
            background: var(--bg-tertiary);
            color: var(--main-color-light);
        }

        @media (max-width: 767px) {
            .app-header {
                padding: 16px;
                margin: 0 -16px 24px -16px;
            }
            .app-header-content {
                max-width: none;
                padding: 0;
            }
            .app-header-title {
                position: static;
                transform: none;
                margin-left: auto;
                margin-right: auto;
            }
        }
        
        /* ===== ENHANCED CALENDAR SECTION ===== */
        .calendar-section {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--shadow-glass);
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }
        
        @media (min-width: 1024px) {
            .calendar-section {
                padding: 40px;
            }
        }
        
        @media (min-width: 1280px) {
            .calendar-section {
                padding: 50px;
            }
        }
        
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            padding: 0 8px;
        }
        
        @media (min-width: 1024px) {
            .calendar-header {
                margin-bottom: 40px;
                padding: 0 12px;
            }
        }
        
        .calendar-nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
            font-size: 20px;
        }
        
        @media (min-width: 1024px) {
            .calendar-nav-btn {
                width: 56px;
                height: 56px;
                font-size: 24px;
                border-radius: 18px;
            }
        }
        
        .calendar-nav-btn:hover,
        .calendar-nav-btn:active {
            background: var(--main-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-secondary);
            border-color: var(--main-color);
        }
        
        .month-year-display {
            font-weight: 700;
            color: var(--main-color);
            cursor: pointer;
            transition: color 0.3s ease;
            letter-spacing: 0.025em;
            background: transparent;
            border: none;
            box-shadow: none;
            text-align: center;
            font-size: 22px;
            padding: 12px 20px;
            min-width: 180px;
        }
        
        @media (max-width: 767px) {
            .month-year-display {
                font-size: 1.125rem;
                padding: 0.5rem 0.75rem;
                min-width: auto;
            }
        }
        
        @media (min-width: 1024px) {
            .month-year-display {
                font-size: 28px;
                padding: 16px 28px;
                min-width: 240px;
            }
        }
        
        .month-year-display:hover,
        .month-year-display:active {
            color: var(--main-color-light);
        }

        @media (max-width: 767px) {
            .calendar-header {
                margin-bottom: 24px;
                padding: 0;
            }
            .month-year-display {
                min-width: 150px;
            }
            .calendar-nav-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }
        
        /* ===== HORIZONTAL SCROLLING LEAVE TYPE SELECTOR ===== */
        .leave-type-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 32px 0;
            padding: 0;
            border-radius: 20px;
            background: transparent;
            border: none;
            box-shadow: none;
            position: relative;
            overflow: hidden;
        }
        
        .leave-type-selector::before {
            display: none;
        }
        
        @media (min-width: 1024px) {
            .leave-type-selector {
                gap: 16px;
                margin: 32px 0 40px 0;
                padding: 0;
                border-radius: 24px;
            }
            .leave-type-selector::before {
                display: none;
            }
        }
        
        .add-leave-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 2px dashed var(--border-color);
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
            margin-right: 4px;
        }
        
        @media (min-width: 1024px) {
            .add-leave-btn {
                width: 44px;
                height: 44px;
                font-size: 20px;
                margin-right: 6px;
            }
        }
        
        .add-leave-btn:hover,
        .add-leave-btn:active {
            background: var(--bg-tertiary);
            color: var(--main-color);
            border-color: var(--main-color);
            transform: scale(1.05);
        }
        
        .leave-type-pills-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            flex: 1;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-mask-image: none;
            mask-image: none;
        }
        
        @media (min-width: 1024px) {
            .leave-type-pills-container {
                gap: 12px;
            }
        }
        
        .leave-type-pills-container::-webkit-scrollbar {
            display: none;
        }
        
        .leave-type-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
            min-height: 36px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        @media (min-width: 1024px) {
            .leave-type-pill {
                padding: 10px 18px;
                font-size: 14px;
                min-height: 44px;
                border-radius: 22px;
            }
        }
        
        .leave-type-pill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }
        
        .leave-type-pill:hover::before,
        .leave-type-pill:active::before {
            left: 100%;
        }
        
        .leave-type-pill.active {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.9), var(--shadow-secondary);
            transform: scale(1.05);
            animation: pulse-pill 2s infinite;
        }
        
        @keyframes pulse-pill {
            0%, 100% { box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.9), var(--shadow-secondary); }
            50% { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.7), var(--shadow-secondary); }
        }
        
        body.light-theme .day-cell.has-leave .day-number,
        body.light-theme .day-cell.half-day .day-number {
            color: #fff !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 767px) {
            .leave-type-selector {
                gap: 8px;
                margin: 20px 0;
            }
            .leave-type-pills-container {
                gap: 6px;
            }
            .leave-type-pill {
                padding: 6px 12px;
                font-size: 13px;
                min-height: 32px;
            }
            .add-leave-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
        }
        
        /* ===== PERFECT SQUARE CALENDAR GRID ===== */
        .calendar-grid-wrapper {
            margin-top: 24px;
        }
        
        @media (min-width: 1024px) {
            .calendar-grid-wrapper {
                margin-top: 32px;
            }
        }
        
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding: 0 4px;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.1em;
        }
        
        @media (min-width: 1024px) {
            .calendar-weekdays {
                font-size: 1.1em;
                padding: 1rem 0.5rem;
                margin-bottom: 20px;
            }
        }
        
        .calendar-weekdays div:first-child {
            color: var(--error-color);
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            padding: 4px;
        }
        
        @media (max-width: 767px) {
            .calendar-grid {
                gap: 6px;
                padding: 0;
            }
            .calendar-weekdays {
                font-size: 11px;
                margin-bottom: 12px;
                gap: 6px;
            }
            .day-cell {
                padding: 6px;
                font-size: clamp(12px, 3.2vw, 16px);
            }
        }
        
        @media (min-width: 1024px) {
            .calendar-grid {
                gap: 1.5rem;
            }
        }
        
        @media (min-width: 1280px) {
            .calendar-grid {
                gap: 2rem;
            }
        }
        
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-align: center;
            position: relative;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            font-weight: 600;
            font-size: clamp(14px, 3.5vw, 18px);
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
        }
        
        @media (max-width: 767px) {
            .day-cell {
                font-size: clamp(12px, 3.5vw, 16px);
                padding: 8px;
            }
            .day-cell .day-number {
                font-size: 0.9em;
            }
        }
        
        @media (min-width: 768px) {
            .day-cell {
                padding: 12px;
            }
        }
        
        @media (min-width: 1024px) {
            .day-cell {
                padding: 16px;
                font-size: 1.6em;
                border-radius: 50%;
            }
        }
        
        @media (min-width: 1280px) {
            .day-cell {
                padding: 20px;
                font-size: 1.9em;
            }
        }
        
        .day-cell:not(.other-month):hover,
        .day-cell:not(.other-month):active {
            background: var(--bg-tertiary);
            transform: scale(1.05);
            box-shadow: var(--shadow-secondary);
            border-color: var(--main-color);
        }
        
        .day-cell.other-month {
            opacity: 0.3;
            pointer-events: none;
            background: var(--bg-primary);
        }
        
        .day-cell.today {
            font-weight: 700;
            border: 3px solid var(--main-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3), var(--shadow-secondary);
            background: rgba(99, 102, 241, 0.1);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3), var(--shadow-secondary); }
            50% { box-shadow: 0 0 0 6px rgba(99, 102, 241, 0.2), var(--shadow-secondary); }
        }
        
        .day-cell.sunday .day-number {
            color: var(--error-color);
        }
        
        .day-cell.selected {
            background: var(--main-color-light);
            color: var(--text-primary);

            background-position: center;

            align-items: center;
            flex-direction: column;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            max-width: 300px;
            animation: fadeIn 1s ease-out forwards;

                opacity: 0;
                transform: translateY(20px);

            to {
                opacity: 1;
                transform: translateY(0);
            }

        .swipe-up-text {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            animation: bounceIn 1s ease-out 0.5s forwards, bounce 2s ease-in-out 1.5s infinite;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            user-select: none;
        }

        @keyframes bounceIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);

            40% {

            60% {

            align-items: center;
            gap: 16px;

            animation: spin 1s ease-in-out infinite;

        }

        .loading-text {
            font-size: 16px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

    <script>
        'use strict';
        // Application state management
        class LeaveBuddyApp {
            constructor() {
                this.state = {
                    focusedDate: new Date(),
                    leaveTypes: [],
                    leaveRecords: {},
                    selectedLeaveType: null,
                    isDragging: false,
                    selectedDates: new Set(),
                    dragMode: null,
                    statsPanelOpen: false,
                    theme: 'dark',
                    user: null,
                    isOfflineMode: false,
                    appLoaded: false,
                    splashReady: false
                };
                this.LEAVE_COLORS = [
                    '#6366f1', '#14b8a6', '#f59e0b', '#10b981', '#8b5cf6',
                    '#06b6d4', '#ec4899', '#ef4444', '#ff6363', '#00ced1',
                    '#ffd700', '#2e8b57'
                ];
                this.STORAGE_KEY = 'leaveBuddyState';
                this.elements = {};
                
                this.initializeElements();
                this.setupEventListeners();
                this.initializeApp();
            }

            initializeElements() {
                this.elements = {
                    appWrapper: document.getElementById('app-wrapper'),
                    loginContainer: document.getElementById('login-container'),
                    appContainer: document.getElementById('app-container'),
                    splashScreen: document.getElementById('splash-screen'),
                    splashLoading: document.getElementById('splash-loading'),
                    swipeUpText: document.getElementById('swipe-up-text'),
                    emailInput: document.getElementById('email-input'),
                    passwordInput: document.getElementById('password-input'),
                    passwordToggleBtn: document.getElementById('password-toggle-btn'),
                    passwordToggleIcon: document.getElementById('password-toggle-icon'),
                    emailSigninBtn: document.getElementById('email-signin-btn'),
                    emailSignupBtn: document.getElementById('email-signup-btn'),
                    googleSigninBtn: document.getElementById('google-signin-btn'),
                    anonContinueBtn: document.getElementById('anon-continue-btn'),
                    forgotPasswordBtn: document.getElementById('forgot-password-btn'),
                    userIdDisplay: document.getElementById('user-id-display'),
                    calendarGrid: document.getElementById('calendar-grid'),
                    monthYearDisplay: document.getElementById('month-year'),
                    prevMonthBtn: document.getElementById('prev-month-btn'),
                    nextMonthBtn: document.getElementById('next-month-btn'),
                    leaveTypePillContainer: document.getElementById('leave-type-pill-container'),
                    addLeaveBtnPlus: document.getElementById('add-leave-btn-plus'),
                    statsGrid: document.getElementById('stats-grid'),
                    emptyStatsState: document.getElementById('empty-stats-state'),
                    modalContainer: document.getElementById('modal-container'),
                    modalContent: document.getElementById('modal-content'),
                    exportDataBtn: document.getElementById('export-data-btn'),
                    importDataBtn: document.getElementById('import-data-btn'),
                    uploadDataInput: document.getElementById('upload-data-input'),
                    resetDataBtn: document.getElementById('reset-data-btn'),
                    statsPanel: document.getElementById('stats-panel'),
                    toggleStatsBtn: document.getElementById('toggle-stats-btn'),
                    toggleText: document.getElementById('toggle-text'),
                    toggleIcon: document.getElementById('toggle-icon'),
                    themeToggleBtn: document.getElementById('theme-toggle-btn'),
                    logoutBtn: document.getElementById('logout-btn')
                };
            }

            async initializeApp() {
                this.showSplashLoading();
                await this.setupAuthStateListener();
                this.state.appLoaded = true;
                this.showSplashSwipeUp();
            }

            showSplashLoading() {
                this.elements.splashLoading.style.display = 'flex';
                this.elements.swipeUpText.style.display = 'none';
            }

            showSplashSwipeUp() {
                this.elements.splashLoading.style.display = 'none';
                this.elements.swipeUpText.style.display = 'block';
                this.state.splashReady = true;
                this.setupSplashSwipeGesture();
            }

            setupSplashSwipeGesture() {
                let startY = 0, startX = 0;
                const threshold = 50, restraint = 100;
                
                const handleTouchStart = (e) => {
                    if (!this.state.splashReady) return;
                    startY = e.touches[0].clientY;
                    startX = e.touches[0].clientX;
                };
                
                const handleTouchEnd = (e) => {
                    if (!this.state.splashReady) return;
                    const deltaY = startY - e.changedTouches[0].clientY;
                    const deltaX = Math.abs(e.changedTouches[0].clientX - startX);
                    if (deltaY > threshold && deltaX < restraint) this.handleSplashSwipeUp();
                };
                
                const handleClick = () => {
                    if (this.state.splashReady) this.handleSplashSwipeUp();
                };
                
                this.elements.splashScreen.addEventListener('touchstart', handleTouchStart, { passive: true });
                this.elements.splashScreen.addEventListener('touchend', handleTouchEnd, { passive: true });
                this.elements.splashScreen.addEventListener('click', handleClick);
            }

            handleSplashSwipeUp() {
                this.state.splashReady = false;
                if (navigator.vibrate) navigator.vibrate(100);
                this.proceedFromSplash();
            }

            async proceedFromSplash() {
                const savedAuthData = localStorage.getItem('leaveBuddyLastAuth');
                if (savedAuthData && this.state.user) {
                    this.showMainApp();
                    this.loadData();
                    return;
                }
                this.showLoginScreen();
            }

            waitForFirebase() {
                return new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('Firebase timeout')), 10000);
                    const checkFirebase = () => {
                        if (window.firebaseAuth && window.firebaseFirestore) {
                            clearTimeout(timeout);
                            resolve();
                        } else {
                            setTimeout(checkFirebase, 100);
                        }
                    };
                    checkFirebase();
                });
            }

            async setupAuthStateListener() {
                try {
                    await this.waitForFirebase();
                    window.firebaseAuth.onAuthStateChanged(window.firebaseAuth.auth, (user) => {
                        this.state.user = user;
                        this.state.isOfflineMode = !user;
                        this.elements.userIdDisplay.textContent = '';
                        if (user) {
                            const authData = { method: 'firebase', userData: { uid: user.uid, email: user.email, displayName: user.displayName } };
                            localStorage.setItem('leaveBuddyLastAuth', JSON.stringify(authData));
                        } else {
                            localStorage.removeItem('leaveBuddyLastAuth');
                        }
                    });
                } catch (error) {
                    console.error('Firebase initialization failed:', error);
                    this.state.isOfflineMode = true;
                }
            }

            showLoginScreen() {
                this.elements.splashScreen.classList.add('is-hidden');
                this.elements.appContainer.classList.add('is-hidden');
                this.elements.loginContainer.classList.remove('is-hidden');
                this.applyTheme();
            }

            showMainApp() {
                this.elements.splashScreen.classList.add('is-hidden');
                this.elements.loginContainer.classList.add('is-hidden');
                this.elements.appContainer.classList.remove('is-hidden');
                this.applyTheme();
                this.render();
            }

            setButtonState(button, isLoading) {
                const spinner = button.querySelector('.fa-spinner');
                const content = button.querySelector('.button-content');
                button.disabled = isLoading;
                button.style.pointerEvents = isLoading ? 'none' : 'auto';
                if (content) content.classList.toggle('hidden', isLoading);
                if (spinner) spinner.classList.toggle('hidden', !isLoading);
            }

            setupEventListeners() {
                // Event listeners setup remains the same, just ensure event delegation is used where needed.
                // ... (previous setupEventListeners code) ...
                document.addEventListener('click', (e) => {
                    const isPillOrAddButton = e.target.closest('#leave-type-pill-container, #add-leave-btn-plus');
                    const isCalendarClick = e.target.closest('.calendar-section');
                    if (!isPillOrAddButton && !isCalendarClick && this.state.selectedLeaveType) {
                        this.state.selectedLeaveType = null;
                        this.renderLeaveTypePills();
                    }
                });
                this.elements.passwordToggleBtn?.addEventListener('click', () => {
                    const isPassword = this.elements.passwordInput.type === 'password';
                    this.elements.passwordInput.type = isPassword ? 'text' : 'password';
                    this.elements.passwordToggleIcon.classList.toggle('fa-eye', !isPassword);
                    this.elements.passwordToggleIcon.classList.toggle('fa-eye-slash', isPassword);
                });
                this.elements.emailSigninBtn?.addEventListener('click', () => this.handleEmailSignIn());
                this.elements.emailSignupBtn?.addEventListener('click', () => this.handleEmailSignUp());
                this.elements.googleSigninBtn?.addEventListener('click', () => this.handleGoogleSignIn());
                this.elements.anonContinueBtn?.addEventListener('click', () => this.handleOfflineMode());
                this.elements.forgotPasswordBtn?.addEventListener('click', () => this.handleForgotPassword());
                this.elements.leaveTypePillContainer?.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (btn && btn.dataset.id) {
                        this.state.selectedLeaveType = btn.dataset.id;
                        this.renderLeaveTypePills();
                        if (navigator.vibrate) navigator.vibrate(30);
                    }
                });
                this.elements.prevMonthBtn?.addEventListener('click', () => {
                    this.state.focusedDate.setMonth(this.state.focusedDate.getMonth() - 1);
                    this.renderCalendar();
                });
                this.elements.nextMonthBtn?.addEventListener('click', () => {
                    this.state.focusedDate.setMonth(this.state.focusedDate.getMonth() + 1);
                    this.renderCalendar();
                });
                this.elements.monthYearDisplay?.addEventListener('click', () => this.showMonthYearPickerModal());
                this.elements.addLeaveBtnPlus?.addEventListener('click', () => this.showLeaveTypeModal());
                this.elements.toggleStatsBtn?.addEventListener('click', () => {
                    this.state.statsPanelOpen = !this.state.statsPanelOpen;
                    this.elements.statsPanel.classList.toggle('open', this.state.statsPanelOpen);
                    this.elements.toggleText.textContent = this.state.statsPanelOpen ? 'Hide Stats' : 'Show Stats';
                    this.elements.toggleIcon.classList.toggle('fa-chevron-down', !this.state.statsPanelOpen);
                    this.elements.toggleIcon.classList.toggle('fa-chevron-up', this.state.statsPanelOpen);
                });
                this.elements.themeToggleBtn?.addEventListener('click', () => this.toggleTheme());
                this.elements.logoutBtn?.addEventListener('click', () => this.handleSignOut());
                this.elements.statsGrid?.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-action="edit-leave-type-stats"]');
                    if (target) {
                        const leaveType = this.state.leaveTypes.find(lt => lt.id === target.dataset.id);
                        if (leaveType) this.showLeaveTypeModal(leaveType);
                    }
                });
                this.elements.exportDataBtn?.addEventListener('click', () => this.exportData());
                this.elements.importDataBtn?.addEventListener('click', () => this.elements.uploadDataInput.click());
                this.elements.uploadDataInput?.addEventListener('change', (e) => this.importData(e));
                this.elements.resetDataBtn?.addEventListener('click', () => this.showResetConfirmation());
                this.elements.modalContainer?.addEventListener('click', (e) => {
                    if (e.target === this.elements.modalContainer) this.hideModal();
                });
                this.elements.modalContent?.addEventListener('click', (e) => this.handleModalActions(e));
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !this.elements.modalContainer.classList.contains('is-hidden')) this.hideModal();
                });
                [this.elements.emailInput, this.elements.passwordInput].forEach(input => {
                    input?.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') this.handleEmailSignIn();
                    });
                });
            }

            async handleEmailSignIn() {
                const email = this.elements.emailInput.value.trim();
                const password = this.elements.passwordInput.value;
                if (!email || !password) return this.showToast('Please enter both email and password', 'error');
                this.setButtonState(this.elements.emailSigninBtn, true);
                try {
                    await window.firebaseAuth.signInWithEmailAndPassword(window.firebaseAuth.auth, email, password);
                    this.showToast('Successfully signed in!', 'success');
                    this.showMainApp();
                    this.loadData();
                } catch (error) {
                    this.showToast(this.getAuthErrorMessage(error.code), 'error');
                } finally {
                    this.setButtonState(this.elements.emailSigninBtn, false);
                }
            }

            async handleEmailSignUp() {
                const email = this.elements.emailInput.value.trim();
                const password = this.elements.passwordInput.value;
                if (!email || !password) return this.showToast('Please enter both email and password', 'error');
                if (password.length < 6) return this.showToast('Password must be at least 6 characters', 'error');
                this.setButtonState(this.elements.emailSignupBtn, true);
                try {
                    await window.firebaseAuth.createUserWithEmailAndPassword(window.firebaseAuth.auth, email, password);
                    this.showToast('Account created successfully!', 'success');
                    this.showMainApp();
                    this.loadData();
                } catch (error) {
                    this.showToast(this.getAuthErrorMessage(error.code), 'error');
                } finally {
                    this.setButtonState(this.elements.emailSignupBtn, false);
                }
            }

            async handleGoogleSignIn() {
                this.setButtonState(this.elements.googleSigninBtn, true);
                try {
                    await window.firebaseAuth.signInWithPopup(window.firebaseAuth.auth, window.firebaseAuth.GoogleAuthProvider);
                    this.showToast('Successfully signed in with Google!', 'success');
                    this.showMainApp();
                    this.loadData();
                } catch (error) {
                    this.showToast(this.getAuthErrorMessage(error.code), 'error');
                    this.setButtonState(this.elements.googleSigninBtn, false);
                }
            }

            handleOfflineMode() {
                this.state.isOfflineMode = true;
                this.state.user = null;
                localStorage.setItem('leaveBuddyLastAuth', JSON.stringify({ method: 'offline', userData: null }));
                this.loadStateFromLocalStorage();
                this.showMainApp();
                this.showToast('Continuing offline - data will be saved locally', 'info');
            }

            async handleForgotPassword() {
                const email = this.elements.emailInput.value.trim();
                if (!email) return this.showToast('Please enter your email address first', 'error');
                try {
                    await window.firebaseAuth.sendPasswordResetEmail(window.firebaseAuth.auth, email);
                    this.showToast('Password reset email sent! Check your inbox.', 'success');
                } catch (error) {
                    this.showToast(this.getAuthErrorMessage(error.code), 'error');
                }
            }

            async handleSignOut() {
                try {
                    if (this.state.isOfflineMode) {
                        this.state.isOfflineMode = false;
                        this.showToast('Signed out of offline mode', 'info');
                    } else {
                        await window.firebaseAuth.signOut(window.firebaseAuth.auth);
                        this.showToast('Successfully signed out', 'success');
                    }
                    localStorage.removeItem('leaveBuddyLastAuth');
                    this.showLoginScreen();
                } catch (error) {
                    this.showToast('Failed to sign out', 'error');
                }
            }

            getAuthErrorMessage(errorCode) {
                const messages = {
                    'auth/user-not-found': 'No account found with this email.',
                    'auth/wrong-password': 'Incorrect password.',
                    'auth/email-already-in-use': 'An account with this email already exists.',
                    'auth/weak-password': 'Password is too weak.',
                    'auth/invalid-email': 'Invalid email address.',
                    'auth/popup-closed-by-user': 'Sign-in popup was closed.',
                    'auth/too-many-requests': 'Too many attempts. Please try again later.',
                };
                return messages[errorCode] || 'Authentication failed. Please try again.';
            }

            async loadData() {
                if (!this.state.isOfflineMode && this.state.user) {
                    await this.loadDataFromFirestore();
                } else {
                    this.loadStateFromLocalStorage();
                }
                this.render();
            }

            async loadDataFromFirestore() {
                try {
                    const docRef = window.firebaseFirestore.doc(window.firebaseFirestore.db, `artifacts/__app_id/users/${this.state.user.uid}/appData/state`);
                    const docSnap = await window.firebaseFirestore.getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        this.state.leaveTypes = data.leaveTypes || [];
                        this.state.leaveRecords = data.leaveRecords || {};
                        this.state.theme = data.theme || 'dark';
                        this.showToast('Data loaded from cloud!', 'success');
                    } else {
                        this.loadStateFromLocalStorage();
                        if (this.state.leaveTypes.length > 0) {
                            this.showToast('Local data found. Saving to cloud...', 'info');
                            await this.saveState();
                        }
                    }
                } catch (error) {
                    this.showToast('Failed to load cloud data. Using local data.', 'error');
                    this.loadStateFromLocalStorage();
                }
                this.state.selectedLeaveType = this.state.leaveTypes[0]?.id || null;
            }

            loadStateFromLocalStorage() {
                try {
                    const saved = localStorage.getItem(this.STORAGE_KEY);
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.state.leaveTypes = data.leaveTypes || [];
                        this.state.leaveRecords = data.leaveRecords || {};
                        this.state.theme = data.theme || 'dark';
                    }
                } catch (error) {
                    localStorage.removeItem(this.STORAGE_KEY);
                }
                this.state.selectedLeaveType = this.state.leaveTypes[0]?.id || null;
            }

            async saveState() {
                const dataToSave = {
                    leaveTypes: this.state.leaveTypes,
                    leaveRecords: this.state.leaveRecords,
                    theme: this.state.theme,
                };
                if (!this.state.isOfflineMode && this.state.user) {
                    try {
                        const docRef = window.firebaseFirestore.doc(window.firebaseFirestore.db, `artifacts/__app_id/users/${this.state.user.uid}/appData/state`);
                        await window.firebaseFirestore.setDoc(docRef, dataToSave);
                    } catch (error) {
                        this.showToast('Failed to save data to cloud.', 'error');
                    }
                } else {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(dataToSave));
                }
            }

            toggleTheme() {
                this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
                this.applyTheme();
                this.saveState();
            }

            applyTheme() {
                document.body.classList.toggle('light-theme', this.state.theme === 'light');
                const icon = this.elements.themeToggleBtn?.querySelector('i');
                if(icon) {
                    icon.className = `fas ${this.state.theme === 'light' ? 'fa-moon' : 'fa-sun'}`;
                }
                document.querySelector('meta[name="theme-color"]').content = this.state.theme === 'light' ? '#f8fafc' : '#1e293b';
            }
            
            showToast(message, type = 'info') {
                document.querySelector('.toast')?.remove();
                const iconMap = { success: 'fa-check-circle', error: 'fa-exclamation-triangle', info: 'fa-info-circle' };
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `<i class="fas ${iconMap[type]}"></i><span>${message}</span>`;
                document.body.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('show'));
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 500);
                }, 4000);
            }

            showModal(title, content) {
                this.elements.modalContent.innerHTML = `
                    <div class="modal-header">
                        <h2>${title}</h2>
                        <button class="close-modal-btn" data-action="close-modal" aria-label="Close modal">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    ${content}`;
                this.elements.modalContainer.classList.remove('is-hidden');
                document.body.style.overflow = 'hidden';
                setTimeout(() => this.elements.modalContent.querySelector('input, button')?.focus(), 100);
            }

            hideModal() {
                this.elements.modalContainer.classList.add('is-hidden');
                document.body.style.overflow = '';
            }

            toISODateString(date) {
                return date.toISOString().split('T')[0];
            }

            generateId() {
                return `lt_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
            }

            render() {
                this.renderCalendar();
                this.renderStats();
            }

            renderCalendar() {
                this.renderLeaveTypePills();
                this.renderCalendarGrid();
                this.setupTouchInteractions();
            }

            renderLeaveTypePills() {
                this.elements.leaveTypePillContainer.innerHTML = this.state.leaveTypes.map(lt => {
                    const isSelected = this.state.selectedLeaveType === lt.id;
                    return `<button class="leave-type-pill ${isSelected ? 'active' : ''}" data-id="${lt.id}" style="background-color: ${lt.color};" role="radio" aria-checked="${isSelected}">${lt.name}</button>`;
                }).join('');
            }

            renderCalendarGrid() {
                const year = this.state.focusedDate.getFullYear();
                const month = this.state.focusedDate.getMonth();
                this.elements.monthYearDisplay.textContent = `${this.state.focusedDate.toLocaleString('default', { month: 'long' })} ${year}`;
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const todayStr = this.toISODateString(new Date());

                let gridHtml = Array(firstDay).fill('<div class="day-cell other-month" aria-hidden="true"></div>').join('');
                for (let i = 1; i <= daysInMonth; i++) {
                    const dayDate = new Date(year, month, i);
                    const dayStr = this.toISODateString(dayDate);
                    const classes = ['day-cell'];
                    if (dayStr === todayStr) classes.push('today');
                    if (dayDate.getDay() === 0) classes.push('sunday');
                    const leaveRecord = this.state.leaveRecords[dayStr];
                    let style = '';
                    if (leaveRecord) {
                        const leaveType = this.state.leaveTypes.find(lt => lt.id === leaveRecord.typeId);
                        if (leaveType) {
                            if (leaveRecord.isHalfDay) {
                                classes.push('half-day');
                                style = `--leave-color: ${leaveType.color}`;
                            } else {
                                classes.push('has-leave');
                                style = `background-color: ${leaveType.color}`;
                            }
                        }
                    }
                    gridHtml += `<div class="${classes.join(' ')}" data-date="${dayStr}" style="${style}" role="gridcell" tabindex="0"><span class="day-number">${i}</span></div>`;
                }
                this.elements.calendarGrid.innerHTML = gridHtml;
            }

            // CHANGE #2c: Removed the old label-swapping JS logic
            renderStats() {
                if (this.state.leaveTypes.length === 0) {
                    this.elements.statsGrid.classList.add('is-hidden');
                    this.elements.emptyStatsState.classList.remove('is-hidden');
                    return;
                }
                this.elements.statsGrid.classList.remove('is-hidden');
                this.elements.emptyStatsState.classList.add('is-hidden');

                this.elements.statsGrid.innerHTML = this.state.leaveTypes.map(lt => {
                    const usedDays = Object.values(this.state.leaveRecords)
                        .filter(r => r.typeId === lt.id)
                        .reduce((sum, r) => sum + (r.isHalfDay ? 0.5 : 1), 0);
                    const remaining = Math.max(0, lt.total - usedDays);
                    const percentage = lt.total > 0 ? (usedDays / lt.total) * 100 : 0;
                    return `
                    <div class="stats-card" style="--card-color: ${lt.color};">
                        <div class="flex items-center justify-between mb-4">
                            <h3>${lt.name}</h3>
                            <button class="text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors p-2 rounded-full hover:bg-[var(--bg-tertiary)]" data-action="edit-leave-type-stats" data-id="${lt.id}" aria-label="Edit ${lt.name}"><i class="fas fa-edit"></i></button>
                        </div>
                        <div class="balance-info">
                            <div class="balance-item used"><span class="balance-number">${usedDays.toFixed(1)}</span><span class="balance-label">Used</span></div>
                            <div class="balance-item remaining"><span class="balance-number">${remaining.toFixed(1)}</span><span class="balance-label">Balance</span></div>
                            <div class="balance-item"><span class="balance-number">${lt.total}</span><span class="balance-label">Total</span></div>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar" style="width: ${percentage}%; background-color: ${lt.color};"></div>
                            <div class="progress-percentage">${Math.round(percentage)}%</div>
                        </div>
                    </div>`;
                }).join('');
            }

            setupTouchInteractions() {
                let startCell = null, isDragging = false, dragMode = null;
                const endDrag = () => {
                    if (isDragging && this.state.selectedDates.size > 0) this.applySelectedDates();
                    isDragging = false; startCell = null;
                    this.updateDragVisuals(true);
                };
                const handleDrag = (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    const touch = e.touches ? e.touches[0] : e;
                    const cell = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.day-cell');
                    if (cell && !cell.classList.contains('other-month')) {
                        this.state.selectedDates.clear();
                        this.getDatesBetween(startCell.dataset.date, cell.dataset.date).forEach(d => this.state.selectedDates.add(d));
                        this.updateDragVisuals();
                    }
                };
                const startDrag = (e) => {
                    const cell = e.target.closest('.day-cell');
                    if (!cell || cell.classList.contains('other-month')) return;
                    if (!this.state.selectedLeaveType) return this.showToast('Please select a leave type first!', 'info');
                    isDragging = true;
                    startCell = cell;
                    const dateStr = cell.dataset.date;
                    const record = this.state.leaveRecords[dateStr];
                    dragMode = (record && record.typeId === this.state.selectedLeaveType) ? 'remove' : 'add';
                    this.state.selectedDates.clear();
                    this.state.selectedDates.add(dateStr);
                    this.updateDragVisuals();
                    if (navigator.vibrate) navigator.vibrate(50);
                };
                this.elements.calendarGrid.addEventListener('mousedown', startDrag);
                document.addEventListener('mousemove', handleDrag);
                document.addEventListener('mouseup', endDrag);
                this.elements.calendarGrid.addEventListener('touchstart', (e) => { startDrag(e); handleDrag(e); }, { passive: false });
                this.elements.calendarGrid.addEventListener('touchmove', handleDrag, { passive: false });
                this.elements.calendarGrid.addEventListener('touchend', endDrag);
            }

            getDatesBetween(startStr, endStr) {
                const dates = [];
                let start = new Date(startStr);
                let end = new Date(endStr);
                if (start > end) [start, end] = [end, start];
                for (let d = start; d <= end; d.setDate(d.getDate() + 1)) {
                    dates.push(this.toISODateString(new Date(d)));
                }
                return dates;
            }

            updateDragVisuals(clear = false) {
                this.elements.calendarGrid.querySelectorAll('.day-cell').forEach(cell => {
                    cell.classList.toggle('selected', !clear && this.state.selectedDates.has(cell.dataset.date));
                });
            }

            applySelectedDates() {
                const dates = Array.from(this.state.selectedDates);
                this.state.selectedDates.clear();
                const record = this.state.leaveRecords[dates[0]];
                const isRemoving = record && record.typeId === this.state.selectedLeaveType;
                
                if (isRemoving) {
                    dates.forEach(d => delete this.state.leaveRecords[d]);
                    this.showToast(`${dates.length} day(s) removed!`, 'success');
                    this.saveState().then(() => this.render());
                } else {
                    this.showHalfDaySelectionModal(dates);
                }
            }
            
            showHalfDaySelectionModal(dates) {
                const listItems = dates.sort().map(dateStr => {
                    const date = new Date(`${dateStr}T00:00:00`);
                    const formatted = date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                    return `
                    <li class="day-type-item" data-date="${dateStr}">
                        <span class="day-type-date">${formatted}</span>
                        <div class="flex items-center">
                            <div class="day-type-toggle">
                                <button class="day-type-toggle-option" data-action="toggle-day-type" data-type="half">Half</button>
                                <button class="day-type-toggle-option active" data-action="toggle-day-type" data-type="full">Full</button>
                            </div>
                            <button class="delete-day-btn" data-action="delete-day-from-modal"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </li>`;
                }).join('');
                this.showModal('Select Leave Duration', `
                    <ul class="day-type-list mb-6">${listItems}</ul>
                    <div class="flex justify-end gap-3 pt-4 border-t border-[var(--border-color)]">
                        <button class="btn btn-secondary" data-action="close-modal">Cancel</button>
                        <button class="btn btn-primary" data-action="save-half-day-selections"><i class="fas fa-save"></i> Save</button>
                    </div>`);
            }

            // Other methods (saveLeaveType, deleteLeaveType, etc.) remain the same
            // ... (previous versions of the remaining helper functions) ...
            saveLeaveType(id) {
                const name = document.getElementById('leave-name').value.trim();
                const total = parseFloat(document.getElementById('leave-total').value);
                const color = document.querySelector('.color-option.selected')?.dataset.color;
                if (!name || isNaN(total) || !color || total < 0) return this.showToast('Please fill all fields correctly.', 'error');
                
                if (id) {
                    const lt = this.state.leaveTypes.find(lt => lt.id === id);
                    if (lt) Object.assign(lt, { name, total, color });
                } else {
                    this.state.leaveTypes.push({ id: this.generateId(), name, total, color });
                }
                this.hideModal();
                this.saveState().then(() => this.render());
            }

            showDeleteConfirmation(id, title, message, confirmAction) {
                this.showModal(title, `
                <div class="space-y-4 text-center">
                    <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                    <p class="text-lg font-semibold">${message}</p>
                    <div class="flex justify-end gap-3 pt-4 border-t border-[var(--border-color)]">
                        <button class="btn btn-secondary" data-action="close-modal">Cancel</button>
                        <button class="btn btn-danger" data-action="${confirmAction}" data-id="${id}"><i class="fas fa-trash-alt"></i> Delete</button>
                    </div>
                </div>`);
            }
            
            deleteLeaveType(id) {
                this.state.leaveTypes = this.state.leaveTypes.filter(lt => lt.id !== id);
                Object.keys(this.state.leaveRecords).forEach(date => {
                    if (this.state.leaveRecords[date].typeId === id) delete this.state.leaveRecords[date];
                });
                if (this.state.selectedLeaveType === id) this.state.selectedLeaveType = this.state.leaveTypes[0]?.id || null;
                this.hideModal();
                this.saveState().then(() => this.render());
            }

            exportData() {
                const dataToExport = {
                    leaveTypes: this.state.leaveTypes,
                    leaveRecords: this.state.leaveRecords,
                    theme: this.state.theme,
                };
                const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `leave-buddy-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            }

            importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (!data.leaveTypes || typeof data.leaveRecords !== 'object') throw new Error();
                        this.state.leaveTypes = data.leaveTypes;
                        this.state.leaveRecords = data.leaveRecords;
                        this.state.theme = data.theme || 'dark';
                        this.applyTheme();
                        this.saveState().then(() => this.render());
                        this.showToast('Data imported successfully!', 'success');
                    } catch {
                        this.showToast('Import failed. Invalid file format.', 'error');
                    }
                };
                reader.readAsText(file);
            }

            resetAllData() {
                this.state.leaveTypes = [];
                this.state.leaveRecords = {};
                this.state.selectedLeaveType = null;
                this.hideModal();
                this.saveState().then(() => this.render());
            }

            handleModalActions(e) {
                const target = e.target.closest('[data-action]');
                if (!target) return;
                const { action, id, type, month, date } = target.dataset;

                switch (action) {
                    case 'close-modal': this.hideModal(); break;
                    case 'save-leave-type': this.saveLeaveType(id); break;
                    case 'delete-leave-type': this.showDeleteConfirmation(id, 'Confirm Deletion', `Delete "${this.state.leaveTypes.find(lt => lt.id === id)?.name}"?`, 'confirm-delete-leave'); break;
                    case 'confirm-delete-leave': this.deleteLeaveType(id); break;
                    case 'select-color': 
                        document.querySelectorAll('.color-option.selected').forEach(el => el.classList.remove('selected'));
                        target.classList.add('selected');
                        break;
                    case 'picker-prev-year': this.state.focusedDate.setFullYear(this.state.focusedDate.getFullYear() - 1); this.updateMonthYearPickerDisplay(); break;
                    case 'picker-next-year': this.state.focusedDate.setFullYear(this.state.focusedDate.getFullYear() + 1); this.updateMonthYearPickerDisplay(); break;
                    case 'select-month-from-picker': this.state.focusedDate.setMonth(parseInt(month)); this.hideModal(); this.renderCalendar(); break;
                    case 'confirm-reset': this.resetAllData(); break;
                    case 'toggle-day-type':
                        const item = target.closest('.day-type-item');
                        item.querySelectorAll('.day-type-toggle-option').forEach(btn => btn.classList.remove('active'));
                        target.classList.add('active');
                        break;
                    case 'delete-day-from-modal': target.closest('.day-type-item')?.remove(); break;
                    case 'save-half-day-selections': 
                        const changes = {};
                        this.elements.modalContent.querySelectorAll('.day-type-item').forEach(li => {
                            changes[li.dataset.date] = { typeId: this.state.selectedLeaveType, isHalfDay: li.querySelector('[data-type="half"]').classList.contains('active') };
                        });
                        Object.assign(this.state.leaveRecords, changes);
                        this.hideModal();
                        this.saveState().then(() => this.render());
                        break;
                }
            }
            updateMonthYearPickerDisplay() {
                const yearDisplay = document.getElementById('picker-year-display');
                if (yearDisplay) yearDisplay.textContent = this.state.focusedDate.getFullYear();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.leaveBuddyApp = new LeaveBuddyApp();
        });
    </script>
</body>
</html>
