<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Buddy</title>

    <!-- Preconnect to improve font loading speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Tailwind CSS and Inter Font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- PWA Meta Tags and Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon/abouticon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icon/abouticon.png">
    <meta name="theme-color" content="#1e293b">
    
    <style>
        /* New Dark & Muted Theme (Default) */
        :root {
            --bg-primary: #1e293b;
            --bg-secondary: #2d3b55;
            --bg-tertiary: #475569;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: #475569;
            --main-color: #6366f1; /* Indigo */
            --main-color-dark: #4338ca;
            --main-color-light: #a5b4fc;
        }

        /* Light Theme Variables (Applied via JS) */
        body.light-theme {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #cbd5e1;
            --main-color: #6366f1; /* Keep accent color consistent */
            --main-color-dark: #4338ca;
            --main-color-light: #4338ca;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            /* Updated layout to support footer */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        
        /* Main Layout */
        .app-card {
            background-color: var(--bg-secondary);
            border-radius: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
        }

        /* Header */
        .app-header {
            border-bottom: 1px solid var(--border-color);
        }
        .app-header .title-logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        /* Calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .day-cell {
            transition: all 0.2s ease-in-out;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            text-align: center;
            position: relative;
            background-color: var(--bg-primary);
            border: 1px solid transparent;
            color: var(--text-primary);
            font-weight: 500;
        }
        .day-cell.other-month {
            opacity: 0.3;
            pointer-events: none;
        }
        .day-cell.today {
            font-weight: bold;
            border: 2px solid var(--main-color);
        }
        .day-cell.weekend {
            background-color: var(--bg-tertiary);
        }
        .day-cell.sunday .day-number {
            color: #f87171;
        }
        .day-cell.selected {
            background-color: var(--main-color-light);
            color: var(--text-primary);
            border: 2px solid var(--main-color);
        }
        .day-cell:not(.other-month):hover {
            background-color: var(--bg-tertiary);
        }
        
        /* New Leave Type Selector */
        .leave-type-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            border-radius: 1rem;
        }
        .leave-type-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 9999px; /* Pill shape */
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            color: white;
            font-weight: 600;
        }
        .leave-type-pill:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        /* Updated active state for pills */
        .leave-type-pill.active {
            box-shadow: 0 0 0 2px var(--text-primary), 0 2px 4px rgba(0,0,0,0.2);
            transform: scale(1.02);
            opacity: 1;
        }
        .light-theme .leave-type-pill.active {
            box-shadow: 0 0 0 2px var(--text-primary), 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Leave Visualization */
        .day-cell.has-leave {
            color: white;
        }
        .day-cell.half-day {
            background-image: linear-gradient(to right, var(--leave-color) 50%, var(--bg-primary) 50%);
            color: var(--text-primary);
        }
        .day-cell.half-day::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }
        .day-cell:not(.half-day).has-leave::after {
             content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }
        .light-theme .day-cell.half-day {
            background-image: linear-gradient(to right, var(--leave-color) 50%, var(--bg-primary) 50%);
        }
        .light-theme .day-cell.half-day::after,
        .light-theme .day-cell:not(.half-day).has-leave::after {
            box-shadow: none;
        }
        
        /* Stats Panel */
        .stats-panel {
            background-color: var(--bg-primary);
            border-radius: 1rem;
            margin-top: 1.5rem;
            transition: all 0.3s ease-in-out;
            max-height: 0;
            overflow: hidden;
            padding: 0; /* Changed from 1.5rem to 0 */
        }
        .stats-panel.open {
            max-height: 500px; /* A large enough value to show content */
            padding: 1.5rem; /* Now only adds padding when open */
        }
        .stats-panel-toggle-btn {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .stats-panel-toggle-btn:hover {
            background-color: var(--bg-tertiary);
        }
        
        /* Revised stats card styling */
        .stats-card {
            background-color: var(--bg-secondary);
            border-radius: 1rem;
            padding: 1.5rem;
            color: var(--text-primary); /* Use theme-based primary text color */
            border-left: 6px solid var(--card-color); /* New colored border */
        }
        .stats-card h3 {
            color: var(--text-primary);
        }
        .stats-card .stats-text-secondary {
            color: var(--text-secondary);
        }
        .stats-card .stats-edit-btn {
            color: var(--text-secondary);
        }
        .stats-card .stats-edit-btn:hover {
            color: var(--text-primary);
        }
        .progress-bar-bg {
            background-color: var(--bg-tertiary);
        }

        /* Modals and forms */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.7);
        }
        /* The modal and its internal elements now use theme-aware variables */
        .modal-content {
            background-color: var(--bg-secondary);
            border-radius: 1.5rem;
        }
        input, select {
            background-color: var(--bg-primary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        input:focus {
            outline: none;
            border-color: var(--main-color);
        }
        .color-option.selected {
             outline: 2px solid var(--main-color);
             outline-offset: 2px;
        }
        .light-theme .modal-content {
             box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div class="app-card">
        <!-- Header -->
        <header class="app-header flex items-center justify-between pb-6">
            <div class="flex-grow flex items-center justify-center gap-3">
                <img src="assets/icon/abouticon.png" alt="Leave Buddy Logo" class="w-10 h-10 rounded-full">
                <h1 class="text-3xl font-bold" style="color: var(--main-color);">Leave Buddy</h1>
            </div>
            <button id="theme-toggle-btn" class="text-xl text-slate-400 hover:text-slate-200 transition-colors">
                <i class="fas fa-sun"></i>
            </button>
        </header>

        <!-- Calendar Section -->
        <div class="calendar-section">
            <!-- Removed the shaded box (calendar-nav-controls) -->
            <div class="flex items-center justify-between px-2 pt-2 mb-4">
                <button id="prev-month-btn" class="p-2 rounded-full hover:bg-slate-700 transition-colors">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="month-year" class="text-xl font-semibold cursor-pointer hover:underline" style="color: var(--main-color);"></h2>
                <button id="next-month-btn" class="p-2 rounded-full hover:bg-slate-700 transition-colors">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <div class="leave-type-selector flex justify-center flex-wrap gap-4 mt-6">
                <div id="leave-type-pill-container" class="flex flex-wrap gap-4 justify-center"></div>
                <button id="add-leave-btn-plus" class="flex items-center justify-center w-10 h-10 border-2 border-slate-600 rounded-full text-slate-400 hover:bg-slate-700 transition-all">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <div class="calendar-grid-wrapper mt-6">
                <div class="grid grid-cols-7 text-center font-medium text-slate-400 mb-2">
                    <div class="text-red-400">Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
            </div>
        </div>

        <!-- Stats Panel -->
        <div class="flex justify-center mt-6">
            <button id="toggle-stats-btn" class="stats-panel-toggle-btn flex items-center gap-2">
                <span id="toggle-text">Show Stats</span>
                <i id="toggle-icon" class="fas fa-chevron-down text-sm transition-transform"></i>
            </button>
        </div>
        <div id="stats-panel" class="stats-panel">
            <div id="stats-grid" class="flex flex-col gap-4"></div>
            <div id="empty-stats-state" class="hidden text-center p-8 text-slate-500">
                <h3 class="text-xl font-semibold text-slate-400 mb-2">No Leave Types Yet</h3>
                <p class="mb-4">Click the '+' button above to add your first leave type.</p>
            </div>
            
            <div class="mt-8 pt-6 border-t border-slate-700">
                <h3 class="text-lg font-semibold mb-4 text-center text-slate-300">Data Management</h3>
                <div class="flex flex-col sm:flex-row gap-4">
                    <button id="export-data-btn" class="flex-1 flex items-center justify-center gap-2 px-6 py-3 bg-slate-700 text-slate-200 font-semibold rounded-full hover:bg-slate-600 transition-colors shadow-sm">
                        <i class="fas fa-download"></i> Export
                    </button>
                    <button id="import-data-btn" class="flex-1 flex items-center justify-center gap-2 px-6 py-3 bg-main-color text-white font-semibold rounded-full shadow-md hover:opacity-90 transition-opacity" style="background-color: var(--main-color);">
                        <i class="fas fa-upload"></i> Import
                    </button>
                    <input type="file" id="upload-data-input" class="hidden" accept=".json">
                </div>
                <button id="reset-data-btn" class="w-full mt-4 bg-red-600 text-white font-semibold py-3 rounded-full hover:bg-red-700 transition-colors shadow-md">
                    Reset All Data
                </button>
            </div>
        </div>
    </div>

    <!-- Footer for developer contact -->
    <footer class="mt-8 text-center text-sm text-slate-400">
        <a href="mailto:arunthomas04042001@gmail.com" class="hover:underline flex items-center justify-center gap-2">
            <i class="fas fa-envelope"></i>
            Reach out to the developer
        </a>
    </footer>

    <!-- Modals -->
    <div id="modal-container" class="hidden fixed top-0 left-0 w-full h-full flex justify-center items-center z-50 modal-backdrop">
        <div id="modal-content" class="p-8 rounded-3xl shadow-2xl w-11/12 max-w-lg"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- STATE MANAGEMENT ---
            let state = {
                focusedDate: new Date(),
                leaveTypes: [], // [{ id, name, total, color }]
                leaveRecords: {}, // { 'YYYY-MM-DD': { typeId: 'leaveTypeId', isHalfDay: false } }
                selectedLeaveType: null,
                isDragging: false,
                selectedDates: new Set(),
                dragMode: null, // 'add' or 'remove'
                statsPanelOpen: false,
                theme: 'dark' // New theme state
            };

            const LEAVE_COLORS = [
                '#6366f1', '#fcd34d', '#F43F5F', '#10B981', '#A955F7', 
                '#3C82F6', '#EC4899', '#f87171'
            ];

            // --- DOM ELEMENTS ---
            const calendarGrid = document.getElementById('calendar-grid');
            const monthYearDisplay = document.getElementById('month-year');
            const prevMonthBtn = document.getElementById('prev-month-btn');
            const nextMonthBtn = document.getElementById('next-month-btn');
            const leaveTypePillContainer = document.getElementById('leave-type-pill-container');
            const addLeaveBtnPlus = document.getElementById('add-leave-btn-plus');
            const statsGrid = document.getElementById('stats-grid');
            const emptyStatsState = document.getElementById('empty-stats-state');
            const modalContainer = document.getElementById('modal-container');
            const modalContent = document.getElementById('modal-content');
            const exportDataBtn = document.getElementById('export-data-btn');
            const importDataBtn = document.getElementById('import-data-btn');
            const uploadDataInput = document.getElementById('upload-data-input');
            const resetDataBtn = document.getElementById('reset-data-btn');
            const statsPanel = document.getElementById('stats-panel');
            const toggleStatsBtn = document.getElementById('toggle-stats-btn');
            const toggleText = document.getElementById('toggle-text');
            const toggleIcon = document.getElementById('toggle-icon');
            const themeToggleBtn = document.getElementById('theme-toggle-btn');

            // --- LOCAL STORAGE ---
            function saveState() {
                localStorage.setItem('leaveBuddyState', JSON.stringify({
                    leaveTypes: state.leaveTypes,
                    leaveRecords: state.leaveRecords,
                    theme: state.theme,
                }));
            }

            function loadState() {
                const saved = localStorage.getItem('leaveBuddyState');
                if (saved) {
                    try {
                        const parsedState = JSON.parse(saved);
                        state.leaveTypes = parsedState.leaveTypes || [];
                        if (parsedState.leaveRecords) {
                            state.leaveRecords = Object.entries(parsedState.leaveRecords).reduce((acc, [date, value]) => {
                                acc[date] = (typeof value === 'string') ? { typeId: value, isHalfDay: false } : value;
                                return acc;
                            }, {});
                        }
                        // Load saved theme preference
                        state.theme = parsedState.theme || 'dark';
                    } catch (e) {
                        console.error("Failed to load state from localStorage:", e);
                        localStorage.removeItem('leaveBuddyState');
                    }
                }
            }
            
            // --- THEME LOGIC ---
            function toggleTheme() {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                applyTheme();
                saveState();
            }

            function applyTheme() {
                document.body.classList.toggle('light-theme', state.theme === 'light');
                const toggleIconClass = state.theme === 'light' ? 'fa-moon' : 'fa-sun';
                themeToggleBtn.innerHTML = `<i class="fas ${toggleIconClass}"></i>`;

                // Update theme color for PWA
                document.querySelector('meta[name="theme-color"]').content = state.theme === 'light' ? '#f1f5f9' : '#1e293b';
            }

            // --- RENDER FUNCTIONS ---
            function render() {
                renderCalendar();
                renderStats();
            }

            function renderCalendar() {
                const year = state.focusedDate.getFullYear();
                const month = state.focusedDate.getMonth();
                monthYearDisplay.textContent = `${state.focusedDate.toLocaleString('default', { month: 'long' })} ${year}`;
                
                let leaveTypeHtml = state.leaveTypes.map(lt => {
                    const isSelected = state.selectedLeaveType === lt.id;
                    return `
                        <button class="leave-type-pill text-sm py-1 px-4 rounded-full font-semibold transition-colors text-white shadow-sm hover:opacity-90 ${isSelected ? 'active' : ''}"
                                data-id="${lt.id}"
                                style="background-color: ${lt.color};">
                            ${lt.name}
                        </button>
                    `;
                }).join('');
                leaveTypePillContainer.innerHTML = leaveTypeHtml;
                
                if (state.leaveTypes.length > 0) {
                    if (!state.selectedLeaveType) {
                        state.selectedLeaveType = state.leaveTypes[0].id;
                    }
                    const activePill = document.querySelector(`.leave-type-pill[data-id="${state.selectedLeaveType}"]`);
                    if(activePill) activePill.classList.add('active');
                } else {
                     state.selectedLeaveType = null;
                }
                
                renderCalendarGrid();
                setupDragAndDrop();
            }

            function renderCalendarGrid() {
                const year = state.focusedDate.getFullYear();
                const month = state.focusedDate.getMonth();
                const firstDayOfMonth = new Date(year, month, 1);
                const lastDayOfMonth = new Date(year, month + 1, 0);
                const firstDayIndex = firstDayOfMonth.getDay();
                
                calendarGrid.innerHTML = '';
                
                for (let i = 0; i < firstDayIndex; i++) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'day-cell other-month';
                    calendarGrid.appendChild(emptyDiv);
                }

                const todayStr = toISODateString(new Date());

                for (let i = 1; i <= lastDayOfMonth.getDate(); i++) {
                    const dayDate = new Date(year, month, i);
                    const dayStr = toISODateString(dayDate);
                    
                    const dayEl = document.createElement('div');
                    dayEl.className = 'day-cell cursor-pointer p-1';
                    dayEl.innerHTML = `<span class="day-number text-sm font-semibold">${i}</span>`;
                    dayEl.dataset.date = dayStr;

                    if (dayDate.getDay() === 0) dayEl.classList.add('sunday');
                    if (dayStr === todayStr) dayEl.classList.add('today');

                    const leaveRecord = state.leaveRecords[dayStr];
                    if (leaveRecord) {
                        const leaveType = state.leaveTypes.find(lt => lt.id === leaveRecord.typeId);
                        if (leaveType) {
                            if (leaveRecord.isHalfDay) {
                                dayEl.classList.add('half-day');
                                dayEl.style.setProperty('--leave-color', leaveType.color);
                            } else {
                                dayEl.style.backgroundColor = leaveType.color;
                                dayEl.classList.add('has-leave');
                            }
                        }
                    }
                    calendarGrid.appendChild(dayEl);
                }
            }
            
            function renderStats() {
                statsGrid.innerHTML = '';
                if (state.leaveTypes.length === 0) {
                    statsGrid.classList.add('hidden');
                    emptyStatsState.classList.remove('hidden');
                    return;
                }
                statsGrid.classList.remove('hidden');
                emptyStatsState.classList.add('hidden');

                state.leaveTypes.forEach(lt => {
                    const usedDays = Object.values(state.leaveRecords)
                        .filter(record => record.typeId === lt.id)
                        .reduce((total, record) => total + (record.isHalfDay ? 0.5 : 1), 0);
                    
                    const totalDays = lt.total;
                    const remaining = Math.max(0, totalDays - usedDays);
                    const percentage = totalDays > 0 ? (usedDays / totalDays) * 100 : 0;
                    
                    const card = document.createElement('div');
                    card.className = 'stats-card';
                    // Set the custom property for the border color
                    card.style.setProperty('--card-color', lt.color);
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-3">
                                <h3 class="font-bold text-lg">${lt.name}</h3>
                            </div>
                            <button class="stats-edit-btn" data-action="edit-leave-type-stats" data-id="${lt.id}">
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>
                        <div class="flex justify-between text-xs stats-text-secondary mb-2">
                            <span>${usedDays} Used</span>
                            <span>${remaining.toFixed(1)} Remaining</span>
                        </div>
                        <div class="progress-bar-bg rounded-full h-2.5">
                            <div class="h-2.5 rounded-full" style="width: ${percentage}%; background-color: ${lt.color};"></div>
                        </div>
                    `;
                    statsGrid.appendChild(card);
                });
            }

            // --- UTILITY FUNCTIONS ---
            function toISODateString(date) {
                const pad = (num) => (num < 10 ? '0' : '') + num;
                return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
            }

            function showModal(title, content) {
                modalContainer.classList.remove('hidden');
                modalContent.innerHTML = `
                    <div class="flex items-center justify-between mb-4 pb-2 border-b border-[var(--border-color)]">
                        <h2 class="text-2xl font-bold" style="color: var(--main-color);">${title}</h2>
                        <button id="close-modal-btn" data-action="close-modal" class="p-2 text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    ${content}
                `;
                // Add theme-aware classes to the modal content container itself
                modalContent.classList.add('bg-[var(--bg-secondary)]');
                modalContent.classList.add('light-theme:shadow-lg');
            }

            function hideModal() {
                modalContainer.classList.add('hidden');
                modalContent.innerHTML = '';
                 // Clean up theme-aware classes
                modalContent.classList.remove('bg-[var(--bg-secondary)]');
                modalContent.classList.remove('light-theme:shadow-lg');
            }

            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `fixed bottom-4 right-4 p-4 rounded-lg shadow-lg flex items-center gap-2 transform translate-x-full transition-transform duration-300 ${type === 'success' ? 'bg-emerald-500 text-white' : type === 'error' ? 'bg-red-500 text-white' : 'bg-blue-500 text-white'}`;
                toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-triangle' : 'info-circle'}"></i><span>${message}</span>`;
                document.body.appendChild(toast);
                setTimeout(() => toast.classList.remove('translate-x-full'), 10);
                setTimeout(() => {
                    toast.classList.add('translate-x-full');
                    toast.addEventListener('transitionend', () => toast.remove());
                }, 3000);
            }

            // --- CORE LOGIC FUNCTIONS ---
            function setupDragAndDrop() {
                let isMouseDown = false;
                let dragStartCell = null;
                
                calendarGrid.onmousedown = (e) => {
                    const targetCell = e.target.closest('.day-cell');
                    if (!targetCell || targetCell.classList.contains('other-month')) return;
                    
                    if (!state.selectedLeaveType) {
                        showToast('Please select a leave type first!', 'info');
                        return;
                    }
                    
                    e.preventDefault();
                    isMouseDown = true;
                    state.selectedDates.clear();
                    
                    dragStartCell = targetCell;
                    const dateStr = dragStartCell.dataset.date;
                    const recordExists = state.leaveRecords[dateStr];
                    
                    state.dragMode = (recordExists && recordExists.typeId === state.selectedLeaveType) ? 'remove' : 'add';
                    
                    state.selectedDates.add(dateStr);
                    updateDragVisuals();
                };
                
                calendarGrid.onmouseover = (e) => {
                    if (!isMouseDown) return;
                    const targetCell = e.target.closest('.day-cell');
                    if (!targetCell || targetCell.classList.contains('other-month')) return;
                    
                    state.selectedDates.clear();
                    const dates = getDatesBetween(dragStartCell.dataset.date, targetCell.dataset.date);
                    dates.forEach(d => state.selectedDates.add(d));
                    
                    updateDragVisuals();
                };
                
                document.onmouseup = () => {
                    if (isMouseDown) {
                        applySelectedDates();
                    }
                    isMouseDown = false;
                    state.selectedDates.clear();
                    updateDragVisuals();
                };
                
                calendarGrid.onclick = (e) => {
                    const targetCell = e.target.closest('.day-cell');
                    if (!targetCell || targetCell.classList.contains('other-month')) return;
                    
                    const dateStr = targetCell.dataset.date;
                    if (state.leaveRecords[dateStr]) {
                        // Handle a single click to possibly change half/full day status
                    }
                };
            }
            
            function getDatesBetween(startStr, endStr) {
                const dates = [];
                let start = new Date(startStr);
                let end = new Date(endStr);
                if (start > end) [start, end] = [end, start];
                
                let current = new Date(start);
                while (current <= end) {
                    dates.push(toISODateString(current));
                    current.setDate(current.getDate() + 1);
                }
                return dates;
            }
            
            function updateDragVisuals() {
                document.querySelectorAll('#calendar-grid .day-cell').forEach(cell => {
                    const dateStr = cell.dataset.date;
                    cell.classList.toggle('selected', state.selectedDates.has(dateStr));
                });
            }
            
            function applySelectedDates() {
                if (state.selectedDates.size === 0) return;
                
                const datesToChange = Array.from(state.selectedDates).filter(dateStr => {
                    const record = state.leaveRecords[dateStr];
                    const isAlreadyLeave = record && record.typeId === state.selectedLeaveType;
                    return (state.dragMode === 'add' && !isAlreadyLeave) || (state.dragMode === 'remove' && isAlreadyLeave);
                });
                
                if (state.dragMode === 'add') {
                    const leaveType = state.leaveTypes.find(lt => lt.id === state.selectedLeaveType);
                    if (leaveType) {
                        const currentUsed = Object.values(state.leaveRecords)
                            .filter(record => record.typeId === leaveType.id)
                            .reduce((total, record) => total + (record.isHalfDay ? 0.5 : 1), 0);
                        
                        const isHalfDayLeave = leaveType.name.toLowerCase().includes('half');
                        const daysToAdd = isHalfDayLeave ? datesToChange.length * 0.5 : datesToChange.length;

                        if (currentUsed + daysToAdd > leaveType.total) {
                            showToast(`Cannot add ${daysToAdd} days. Not enough balance!`, 'error');
                            return;
                        }
                    }
                }
                
                if(datesToChange.length > 0) {
                    datesToChange.forEach(dateStr => {
                        if (state.dragMode === 'add') {
                            const leaveType = state.leaveTypes.find(lt => lt.id === state.selectedLeaveType);
                            const isHalfDayLeave = leaveType.name.toLowerCase().includes('half');
                            state.leaveRecords[dateStr] = { typeId: state.selectedLeaveType, isHalfDay: isHalfDayLeave };
                        } else {
                            delete state.leaveRecords[dateStr];
                        }
                    });
                    
                    saveState();
                    renderCalendar();
                    renderStats();
                    const action = state.dragMode === 'add' ? 'added' : 'removed';
                    showToast(`${datesToChange.length} day${datesToChange.length > 1 ? 's' : ''} ${action}!`, 'success');
                }
            }
            
            // --- EVENT LISTENERS ---
            leaveTypePillContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (btn && btn.dataset.id) {
                    state.selectedLeaveType = btn.dataset.id;
                    document.querySelectorAll('.leave-type-pill').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            });

            prevMonthBtn.addEventListener('click', () => {
                state.focusedDate.setMonth(state.focusedDate.getMonth() - 1);
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', () => {
                state.focusedDate.setMonth(state.focusedDate.getMonth() + 1);
                renderCalendar();
            });
            
            monthYearDisplay.addEventListener('click', () => {
                showMonthYearPickerModal();
            });

            addLeaveBtnPlus.addEventListener('click', () => {
                showLeaveTypeModal();
            });

            // Toggle stats panel
            toggleStatsBtn.addEventListener('click', () => {
                state.statsPanelOpen = !state.statsPanelOpen;
                statsPanel.classList.toggle('open', state.statsPanelOpen);
                toggleText.textContent = state.statsPanelOpen ? 'Hide Stats' : 'Show Stats';
                toggleIcon.classList.toggle('fa-chevron-down', !state.statsPanelOpen);
                toggleIcon.classList.toggle('fa-chevron-up', state.statsPanelOpen);
            });

            // Toggle theme
            themeToggleBtn.addEventListener('click', toggleTheme);
            
            statsGrid.addEventListener('click', (e) => {
                const target = e.target.closest('[data-action="edit-leave-type-stats"]');
                if(target) {
                    const id = target.dataset.id;
                    const leaveType = state.leaveTypes.find(lt => lt.id === id);
                    if (leaveType) {
                        showLeaveTypeModal(leaveType);
                    }
                }
            });

            modalContent.addEventListener('click', (e) => {
                const target = e.target.closest('[data-action]');
                if (!target) return;

                switch (target.dataset.action) {
                    case 'save-leave-type':
                        const id = target.dataset.id;
                        const name = document.getElementById('leave-name').value.trim();
                        const totalInput = document.getElementById('leave-total').value;
                        const total = totalInput ? parseInt(totalInput) : 0;
                        const selectedColorBtn = document.querySelector('.color-option.selected');
                        const color = selectedColorBtn ? selectedColorBtn.dataset.color : LEAVE_COLORS[0];

                        if (!name || !total) {
                            showToast('Please fill all required fields.', 'error');
                            return;
                        }
                        
                        if (id) {
                            const lt = state.leaveTypes.find(l => l.id === id);
                            if (lt) {
                                lt.name = name;
                                lt.total = total;
                                lt.color = color;
                            }
                        } else {
                            const newId = `lt_${Date.now()}`;
                            state.leaveTypes.push({ id: newId, name, total, color });
                        }

                        hideModal();
                        saveState();
                        renderStats();
                        renderCalendar();
                        break;
                    
                    case 'delete-leave-type':
                        const deleteId = target.dataset.id;
                        showModal('Confirm Deletion', `
                            <div class="space-y-4 pt-4">
                                <p class="text-sm text-[var(--text-secondary)]">Are you sure you want to delete this leave type? This action cannot be undone and will remove all recorded leave days of this type.</p>
                            </div>
                            <div class="flex items-center justify-end gap-2 mt-6 pt-4 border-t border-[var(--border-color)]">
                                <button data-action="close-modal" class="px-4 py-2 text-sm font-medium text-[var(--text-primary)] bg-[var(--bg-tertiary)] rounded-md hover:bg-[var(--bg-primary)]">Cancel</button>
                                <button data-action="confirm-delete-leave" data-id="${deleteId}" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700">Delete</button>
                            </div>
                        `);
                        break;
                    
                    case 'confirm-delete-leave':
                        const leaveIdToDelete = target.dataset.id;
                        state.leaveTypes = state.leaveTypes.filter(lt => lt.id !== leaveIdToDelete);
                        state.leaveRecords = Object.fromEntries(
                            Object.entries(state.leaveRecords).filter(([date, record]) => record.typeId !== leaveIdToDelete)
                        );
                        hideModal();
                        saveState();
                        renderStats();
                        renderCalendar();
                        showToast('Leave type deleted successfully!', 'success');
                        break;
                    
                    case 'select-color':
                        // Fix: The selected class is now correctly applied and removed
                        document.querySelectorAll('.color-option').forEach(btn => btn.classList.remove('selected'));
                        target.classList.add('selected');
                        break;

                    case 'picker-prev-year':
                        state.focusedDate.setFullYear(state.focusedDate.getFullYear() - 1);
                        updateMonthYearPickerDisplay();
                        break;
                    case 'picker-next-year':
                        state.focusedDate.setFullYear(state.focusedDate.getFullYear() + 1);
                        updateMonthYearPickerDisplay();
                        break;
                    case 'select-month-from-picker':
                        state.focusedDate.setMonth(parseInt(target.dataset.month));
                        hideModal();
                        renderCalendar();
                        break;
                    case 'close-modal':
                        hideModal();
                        break;
                }
            });

            exportDataBtn.addEventListener('click', () => {
                const dataStr = JSON.stringify({ leaveTypes: state.leaveTypes, leaveRecords: state.leaveRecords, theme: state.theme }, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `leave-buddy-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Data exported successfully!', 'success');
            });

            importDataBtn.addEventListener('click', () => {
                uploadDataInput.click();
            });

            uploadDataInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.leaveTypes && data.leaveRecords) {
                            state.leaveTypes = data.leaveTypes;
                            state.leaveRecords = data.leaveRecords;
                            if (data.theme) {
                                state.theme = data.theme;
                                applyTheme();
                            }
                            saveState();
                            render();
                            showToast('Data imported successfully!', 'success');
                        } else {
                            throw new Error('Invalid file format.');
                        }
                    } catch (error) {
                        showToast('Failed to import data.', 'error');
                        console.error('Import error:', error);
                    }
                };
                reader.readAsText(file);
            });

            resetDataBtn.addEventListener('click', () => {
                showModal('Confirm Reset', `
                    <div class="space-y-4 pt-4">
                        <p class="text-sm text-[var(--text-secondary)]">Are you sure you want to reset all data? This action cannot be undone and will permanently delete all your leave types and records.</p>
                    </div>
                    <div class="flex items-center justify-end gap-2 mt-6 pt-4 border-t border-[var(--border-color)]">
                        <button data-action="close-modal" class="px-4 py-2 text-sm font-medium text-[var(--text-primary)] bg-[var(--bg-tertiary)] rounded-md hover:bg-[var(--bg-primary)]">Cancel</button>
                        <button data-action="confirm-reset" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700">Reset All Data</button>
                    </div>
                `);
            });
            
            modalContent.addEventListener('click', (e) => {
                const target = e.target.closest('[data-action]');
                if (!target) return;

                switch (target.dataset.action) {
                    case 'confirm-reset':
                        state.leaveTypes = [];
                        state.leaveRecords = {};
                        hideModal();
                        saveState();
                        render();
                        showToast('All data has been reset!', 'success');
                        break;
                }
            });

            function showLeaveTypeModal(leaveType = null) {
                const isEditing = !!leaveType;
                const modalTitle = isEditing ? 'Edit Leave Type' : 'Add New Leave Type';
                const initialName = leaveType ? leaveType.name : '';
                const initialTotal = leaveType ? leaveType.total : '';
                const initialColor = leaveType ? leaveType.color : LEAVE_COLORS[0];
                
                const colorOptions = LEAVE_COLORS.map(color => `
                    <button type="button" class="w-10 h-10 border-2 border-[var(--border-color)] rounded-full cursor-pointer transition-transform hover:scale-110 color-option ${color === initialColor ? 'selected' : ''}"
                            data-color="${color}"
                            data-action="select-color"
                            style="background-color: ${color};">
                    </button>
                `).join('');

                showModal(modalTitle, `
                    <div class="space-y-6 p-4">
                        <div class="form-group">
                            <label for="leave-name" class="block text-sm font-medium text-[var(--text-secondary)]">Leave Type Name</label>
                            <input type="text" id="leave-name" value="${initialName}" class="mt-1 block w-full px-4 py-2 rounded-lg border-[var(--border-color)] shadow-sm focus:ring-[var(--main-color)] focus:border-[var(--main-color)] text-base" placeholder="e.g., Annual Leave or Half Day Sick Leave">
                        </div>
                        <div class="form-group">
                            <label for="leave-total" class="block text-sm font-medium text-[var(--text-secondary)]">Total Days per Year</label>
                            <input type="number" id="leave-total" value="${initialTotal}" class="mt-1 block w-full px-4 py-2 rounded-lg border-[var(--border-color)] shadow-sm focus:ring-[var(--main-color)] focus:border-[var(--main-color)] text-base" placeholder="e.g., 20">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2">Choose Color</label>
                            <div id="color-picker" class="flex flex-wrap gap-3">
                                ${colorOptions}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-end gap-2 mt-6 pt-4 border-t border-[var(--border-color)]">
                        ${isEditing ? `<button data-action="delete-leave-type" data-id="${leaveType.id}" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-full hover:bg-red-700">Delete</button>` : ''}
                        <button data-action="save-leave-type" data-id="${isEditing ? leaveType.id : ''}" type="button" class="px-4 py-2 text-sm font-medium text-white rounded-full bg-[var(--main-color)] hover:opacity-90" style="background-color: var(--main-color);">Save</button>
                    </div>
                `);
            }
            
            function showMonthYearPickerModal() {
                const currentYear = state.focusedDate.getFullYear();
                const currentMonth = state.focusedDate.getMonth();
                const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

                const monthGrid = monthNames.map((name, index) => `
                    <button class="w-full py-3 text-center transition-colors rounded-lg bg-[var(--bg-tertiary)] hover:bg-[var(--bg-secondary)] ${index === currentMonth ? 'ring-2 ring-[var(--main-color)]' : ''}" data-action="select-month-from-picker" data-month="${index}">
                        ${name}
                    </button>
                `).join('');

                showModal(`Select Month & Year`, `
                    <div class="space-y-4 pt-4">
                        <div class="flex items-center justify-between">
                            <button data-action="picker-prev-year" class="p-2 rounded-full hover:bg-[var(--bg-tertiary)]">
                                <svg class="w-5 h-5 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            </button>
                            <span id="picker-year-display" class="text-lg font-semibold">${currentYear}</span>
                            <button data-action="picker-next-year" class="p-2 rounded-full hover:bg-[var(--bg-tertiary)]">
                                <svg class="w-5 h-5 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                        <div class="grid grid-cols-4 gap-2 mt-4">
                            ${monthGrid}
                        </div>
                    </div>
                `);
            }
            
            function updateMonthYearPickerDisplay() {
                const currentYear = state.focusedDate.getFullYear();
                const currentMonth = state.focusedDate.getMonth();
                const pickerYearDisplay = document.getElementById('picker-year-display');
                if (pickerYearDisplay) {
                    pickerYearDisplay.textContent = currentYear;
                }
                const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                const monthGrid = document.querySelector('.picker-grid');
                if (monthGrid) {
                     monthGrid.innerHTML = monthNames.map((name, index) => `
                        <button class="w-full py-3 text-center transition-colors rounded-lg bg-[var(--bg-tertiary)] hover:bg-[var(--bg-secondary)] ${index === currentMonth ? 'ring-2 ring-[var(--main-color)]' : ''}" data-action="select-month-from-picker" data-month="${index}">
                            ${name}
                        </button>
                    `).join('');
                }
            }
            
            // --- INITIALIZATION ---
            loadState();
            applyTheme(); // Apply theme on initial load
            render();
        });
    </script>
</body>
</html>
